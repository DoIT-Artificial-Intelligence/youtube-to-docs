description = "Make a YouTube video accessible: WCAG 2.1 / Section 508 corrected captions, audio description and accessible videos."

prompt = """Please make the YouTube video at {{args}} accessible using the `process_video` tool.

- Identify the YouTube URL or ID from the arguments.
- Set `corrected_captions`:
  - By default use `'default'`: `gemini-4-argon` correcting a `gemini-3.5-transcribe` transcript (transcribed in the same run), with speaker names and spellings read from the video.
  - If "youtube" is mentioned as the source, use `gemini-4-argon-youtube` (starts from the YouTube captions; no transcription).
  - If an STT model is mentioned as the source (e.g. "gcp-chirp3"), use `gemini-4-argon-{stt model}` (e.g. `gemini-4-argon-gcp-chirp3`).
  - If a faster or cheaper model is requested ("flash", "cheap"), use `gemini-3.5-flash-lite` as the model, e.g. `gemini-3.5-flash-lite-gemini-3.5-transcribe`.
- The run writes the corrected captions (SRT and WebVTT), the audio description (WebVTT tracks and a descriptive transcript), the original video and a copy with captions burned in and descriptions narrated, plus an Able Player page in `vtt-files/` for checking the WebVTT files. It takes about 20 minutes for a 3-hour video.

Do not ask for confirmation."""
